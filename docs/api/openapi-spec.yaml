openapi: 3.1.0
info:
  title: AniRAG API
  description: |
    Production-grade anime intelligence microservice built on 100% free infrastructure.

    Key Features
    - Hybrid retrieval (dense vectors + sparse BM25)
    - Intent-aware query routing
    - Semantic caching for low-latency responses
    - Production patterns (rate limiting, circuit breakers)

    Authentication
    All endpoints require an API key via X-API-Key header.
    Obtain keys from your deployment's admin interface.

    Rate Limits
    - 100 requests/hour per API key
    - 429 responses include Retry-After header

    Error Handling
    Standard HTTP status codes with JSON error bodies:
    {
      "detail": "Human-readable error message",
      "status": "error_code",
      "request_id": "uuid-v4"
    }
  version: 1.0.0
  contact:
    name: AniRAG Support
    url: https://github.com/shankssc/ash-bot/issues
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://ash-bot.onrender.com
    description: Production deployment (Render.com)
  - url: http://localhost:8000
    description: Local development

security:
  - ApiKeyAuth: []

paths:
  /api/v1/health:
    get:
      tags:
        - health
      summary: Service health check
      description: |
        Comprehensive health check of all external dependencies.

        Returns 200 if all critical dependencies are healthy.
        Returns 503 if any critical dependency is degraded/unavailable.

        No authentication required - public endpoint for monitoring.
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                timestamp: "2026-02-18T21:45:32Z"
                checks:
                  app:
                    status: ok
                    version: "1.0.0"
                    environment: development
                  qdrant:
                    status: ok
                    url: "https://your-uuid.us-east-1-0.aws.cloud.qdrant.io:6333"
                  groq:
                    status: ok
                    model: "llama-3.1-70b-versatile"
                  redis:
                    status: ok
                    url: "[REDACTED]"
        "503":
          description: One or more dependencies degraded/unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: degraded
                timestamp: "2026-02-18T21:45:32Z"
                checks:
                  app:
                    status: ok
                    version: "1.0.0"
                    environment: development
                  qdrant:
                    status: degraded
                    message: "QDRANT_URL not configured"
                  groq:
                    status: degraded
                    message: "GROQ_API_KEY missing"
                  redis:
                    status: degraded
                    message: "REDIS_URL not configured"

  /api/v1/query:
    post:
      tags:
        - query
      summary: Submit anime knowledge query
      description: |
        Submit a natural language query about anime. Returns AI-generated answer with source citations.

        Query Types Supported
        - Factual: "Who directed Cowboy Bebop?"
        - Recommendation: "Anime similar to Attack on Titan"
        - Comparison: "Naruto vs One Piece power systems"
        - Creative: "Write a haiku about Goku"
      operationId: queryAnimeKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Successful query processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
              example:
                query_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                query: "Best space western anime?"
                answer: "Cowboy Bebop (1998) is widely considered the definitive space western anime..."
                intent: "recommendation"
                sources:
                  - anime_id: 1
                    title: "Cowboy Bebop"
                    chunk_id: "anime_1_chunk_0"
                    text_snippet: "Space bounty hunter Spike Spiegel navigates the solar system..."
                    similarity_score: 0.89
                metadata:
                  retrieval:
                    dense_results: 5
                    sparse_results: 5
                    fusion_method: "rrf_k60"
                  generation:
                    model: "llama-3.1-70b-versatile"
                    tokens_used: 245
                latency_ms: 342.5
                cached: false
                timestamp: "2026-02-18T21:45:32.123456Z"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/AuthenticationError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key required for all endpoints except /health.

        Example header:
        X-API-Key: your-super-secret-api-key-here

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - checks
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          description: Overall service status
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of health check
        checks:
          type: object
          description: Individual dependency health checks
          properties:
            app:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, degraded, error]
                version:
                  type: string
                environment:
                  type: string
            qdrant:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, degraded, error]
                url:
                  type: string
                message:
                  type: string
            groq:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, degraded, error]
                model:
                  type: string
                message:
                  type: string
            redis:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, degraded, error]
                url:
                  type: string
                message:
                  type: string

    QueryRequest:
      type: object
      required:
        - query
      properties:
        query:
          type: string
          minLength: 3
          maxLength: 500
          description: Natural language query about anime
          example: "Best space western anime?"
        top_k:
          type: integer
          minimum: 1
          maximum: 20
          default: 5
          description: Number of context chunks to retrieve
        temperature:
          type: number
          minimum: 0.0
          maximum: 2.0
          default: 0.7
          description: LLM sampling temperature (higher = more creative)
        use_cache:
          type: boolean
          default: true
          description: Whether to check semantic cache before processing

    QueryResponse:
      type: object
      required:
        - query_id
        - query
        - answer
        - intent
        - sources
        - latency_ms
        - cached
        - timestamp
      properties:
        query_id:
          type: string
          format: uuid
          description: Unique identifier for this query
        query:
          type: string
          description: Original user query
        answer:
          type: string
          description: AI-generated answer with citations
        intent:
          type: string
          enum: [factual, recommendation, comparison, creative, meta]
          description: Classified query intent
        sources:
          type: array
          items:
            type: object
            required:
              - anime_id
              - title
              - chunk_id
              - text_snippet
              - similarity_score
            properties:
              anime_id:
                type: integer
                description: MyAnimeList ID
              title:
                type: string
                description: Anime title
              chunk_id:
                type: string
                description: Source chunk identifier
              text_snippet:
                type: string
                description: Relevant excerpt from source
              similarity_score:
                type: number
                description: Retrieval similarity score (0.0-1.0)
          description: Source citations supporting the answer
        metadata:
          type: object
          description: Internal processing metadata (debugging/optimization)
          properties:
            retrieval:
              type: object
              properties:
                dense_results:
                  type: integer
                sparse_results:
                  type: integer
                fusion_method:
                  type: string
            generation:
              type: object
              properties:
                model:
                  type: string
                tokens_used:
                  type: integer
        latency_ms:
          type: number
          description: Total processing time in milliseconds
        cached:
          type: boolean
          description: Whether response came from semantic cache
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of response generation

  responses:
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              status:
                type: string
                enum: [validation_error]
              request_id:
                type: string
                format: uuid
          example:
            detail: "query: Query cannot be empty"
            status: validation_error
            request_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    AuthenticationError:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              status:
                type: string
                enum: [authentication_error]
              request_id:
                type: string
                format: uuid
          example:
            detail: "Invalid API key"
            status: authentication_error
            request_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    RateLimitError:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              status:
                type: string
                enum: [rate_limit_exceeded]
              request_id:
                type: string
                format: uuid
          example:
            detail: "Rate limit exceeded: 100 requests/hour"
            status: rate_limit_exceeded
            request_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    ServiceUnavailableError:
      description: Critical dependency unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              detail:
                type: string
              status:
                type: string
                enum: [service_unavailable]
              request_id:
                type: string
                format: uuid
          example:
            detail: "Qdrant vector database unavailable"
            status: service_unavailable
            request_id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

tags:
  - name: health
    description: Service health and monitoring endpoints
  - name: query
    description: Anime knowledge query endpoints
