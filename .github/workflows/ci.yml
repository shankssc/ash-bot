name: ash-bot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: 🐍 Python Checks & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt

      - name: 🤗 Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-hf-

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install semgrep  # Linux-only but CI is Linux
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"

      - name: 🔍 Run Semgrep (deep security patterns)
        run: semgrep scan --config auto app/

      - name: 🧪 Run tests with coverage
        run: |
          # Create .env with test values + secrets for validation tests
          cat > .env << EOF
          ENVIRONMENT=test
          QDRANT_URL=${{ secrets.QDRANT_URL || 'https://test.qdrant.io:6333' }}
          QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY || 'test-key' }}
          REDIS_URL=${{ secrets.REDIS_URL || 'https://test.upstash.io' }}
          REDIS_TOKEN=${{ secrets.REDIS_TOKEN || 'test-token' }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY || 'test-groq' }}
          API_KEY=${{ secrets.API_KEY || 'test-api-key' }}
          OLLAMA_BASE_URL=http://localhost:11434
          EOF

          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
        env:
          ENVIRONMENT: test
          QDRANT_URL: ${{ secrets.QDRANT_URL || 'https://test.qdrant.io:6333' }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY || 'test-key' }}
          REDIS_URL: ${{ secrets.REDIS_URL || 'https://test.upstash.io' }}
          REDIS_TOKEN: ${{ secrets.REDIS_TOKEN || 'test-token' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'test-groq' }}
          API_KEY: ${{ secrets.API_KEY || 'test-api-key' }}

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success()

      - name: 🧠 Memory profiling (Linux-only, main branch)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        run: |
          pip install memray pytest-memray
          pytest tests/ -v --memray --memray-keep-results
        continue-on-error: true # Non-blocking for now

  windows-compat:
    name: 🪟 Windows Compatibility Check
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Windows-safe dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy bandit detect-secrets pip-audit pytest pytest-asyncio pytest-cov

      - name: 🧹 Basic linting (Windows)
        run: ruff check app/ tests/

      - name: 🧪 Run basic tests (Windows)
        run: |
          echo ENVIRONMENT=test > .env
          pytest tests/ -v --tb=short -m "not memory"
        env:
          ENVIRONMENT: test
        continue-on-error: true # Non-blocking for now

  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint-test, windows-compat]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        run: |
          docker build -t ash-bot:ci -f deployment/Dockerfile .
