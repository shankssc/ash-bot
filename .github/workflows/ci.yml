name: ash-bot CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: 🐍 Python Checks & Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements*.txt

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install semgrep  # Linux-only but CI is Linux

      - name: 🪝 Run pre-commit (all linting/formatting/security)
        uses: pre-commit/action@v3.0.1

      - name: 🔍 Run Semgrep (deep security patterns)
        run: semgrep scan --config auto app/

      - name: 🧪 Run tests with coverage
        run: |
          # Create minimal .env for tests
          echo "ENVIRONMENT=test" > .env
          echo "OLLAMA_BASE_URL=http://localhost:11434" >> .env
          pytest tests/ -v --tb=short --cov=app --cov-report=xml --cov-report=term-missing
        env:
          ENVIRONMENT: test

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        if: success()

      - name: 🧠 Memory profiling (Linux-only, main branch)
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        run: |
          pip install memray pytest-memray
          pytest tests/ -v --memray --memray-keep-results
        continue-on-error: true # Non-blocking for now

  windows-compat:
    name: 🪟 Windows Compatibility Check
    runs-on: windows-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 📦 Install Windows-safe dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy bandit detect-secrets pip-audit pytest pytest-asyncio pytest-cov

      - name: 🧹 Basic linting (Windows)
        run: ruff check app/ tests/

      - name: 🧪 Run basic tests (Windows)
        run: |
          echo ENVIRONMENT=test > .env
          pytest tests/ -v --tb=short -m "not memory"
        env:
          ENVIRONMENT: test
        continue-on-error: true # Non-blocking for now

  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint-test, windows-compat]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker image
        run: |
          docker build -t ash-bot:ci -f deployment/Dockerfile .
